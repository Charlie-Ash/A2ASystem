[pytest]
; The project's modules use absolute imports rooted at src/ (e.g.
; "from orchestrator.pipeline.graph import build_graph"), matching how main.py is run
; today (from inside src/). This puts src/ on sys.path for the test run
; without needing any code changes or a packages layout.
pythonpath = src
; Lets async def tests (the RAG agent executor's A2A wiring tests) run
; without needing an @pytest.mark.asyncio decorator on every function.
asyncio_mode = auto
